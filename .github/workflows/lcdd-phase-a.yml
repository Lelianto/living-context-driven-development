name: LCDD Phase A

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install reference implementation
        working-directory: implementation
        run: npm ci

      - name: Build LCDD CLI
        working-directory: implementation
        run: npm run build --workspace=@lcdd/core && npm run build --workspace=@lcdd/cli

      - name: Validate LCDD change
        env:
          LCDD_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          LCDD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node implementation/packages/cli/dist/index.js check --stage ci --base "$LCDD_BASE" --head "$LCDD_HEAD" --strict --json
