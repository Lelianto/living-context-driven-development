title: "Every public Core, CLI, or MCP contract SHOULD have automated tests"
description: >
  Public types, CLI flags and exit codes, JSON output, MCP tool schemas, and lifecycle or governance
  behavior should be covered by deterministic tests. A public behavior change without corresponding
  tests must be explained in review and cannot be represented as complete in the roadmap.
