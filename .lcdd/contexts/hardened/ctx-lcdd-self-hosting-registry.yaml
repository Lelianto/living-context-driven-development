  specification:
    type: "file-exists"
    config:
      files:
        - ".lcdd/config.yaml"
        - ".lcdd/pack.yaml"
        - ".lcdd/contexts/.events.log"
      at_least_one: false
    violation_message_template: "The tracked self-governance Registry is incomplete."
evidence:
  - type: "normative-principle"
    uri: "https://github.com/Lelianto/living-context-driven-development/blob/main/specification/0001-core-principles.md"
    description: "The specification repository MUST contain a Context Registry or equivalent."
