title: "Reference and runtime Context schemas MUST remain identical"
description: >
  The canonical schema in reference/schema/context-schema.json and the runtime copy in
  implementation/packages/core/src/context-schema.json must remain byte-identical. An additive or
  breaking schema change must update the normative schema document, both JSON copies, examples,
  migration guidance when applicable, and validation tests in the same governed change.
