id: "ctx-lcdd-drift-proposal-only"
version: 1
created_at: "2026-08-08T09:00:00Z"
updated_at: "2026-08-08T09:00:00Z"
title: "Drift evidence MUST produce proposals, never automatic Context mutation"
description: >
  Code-to-Context drift detection may report evidence and propose review, but code is not authority
  to rewrite governance. Drift must never directly modify or activate a Context. Hardened and Local
  Context changes both pass through review; Hardened changes follow the full governed RFC process.
