title: "Normative specification changes MUST follow governed RFC review"
description: >
  Any change to specification/** that alters normative behavior, terminology, lifecycle,
  authority, governance, schema, protocol, security, or compatibility must be proposed through
  the structured RFC process in CONTRIBUTING.md. AI agents may draft or recommend changes but
  cannot approve them. The repository owner or delegated maintainer must explicitly approve the
  change, and unresolved objections must remain visible.
