version: "0.5.0"

registry:
  mode: git-tracked
  pack: lcdd-development

pipeline:
  enabled: true
  human_governed: true

enforcement:
  default_mode: warn
  ci_mode: block

operational_data:
  tracked: false
  ignored_paths:
    - ".lcdd/sources/**"
    - ".lcdd/snapshots/**"
    - ".lcdd/discovery/**"
    - ".lcdd/contexts/.enforcements.log"
    - ".lcdd/contexts/.dismissals.log"
    - ".lcdd/contexts/.heals.log"
