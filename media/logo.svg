<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="200" cy="200" r="180" fill="url(#g)" opacity="0.12"/>

  <!-- Context layers -->
  <rect x="80" y="80" width="240" height="240" rx="16" fill="none" stroke="url(#g)" stroke-width="3" opacity="0.4"/>
  <rect x="110" y="110" width="180" height="180" rx="12" fill="none" stroke="url(#g)" stroke-width="3" opacity="0.6"/>
  <rect x="140" y="140" width="120" height="120" rx="8" fill="url(#g2)" opacity="0.85"/>

  <!-- Inner symbol: abstract "C" for Context -->
  <text x="200" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>

  <!-- Lifecycle dots -->
  <circle cx="200" cy="55" r="8" fill="#10b981" opacity="0.9"/>
  <circle cx="280" cy="100" r="6" fill="#34d399" opacity="0.7"/>
  <circle cx="320" cy="200" r="6" fill="#34d399" opacity="0.5"/>
  <circle cx="280" cy="300" r="6" fill="#6ee7b7" opacity="0.4"/>
  <circle cx="200" cy="345" r="5" fill="#6ee7b7" opacity="0.3"/>
  <circle cx="120" cy="300" r="5" fill="#a7f3d0" opacity="0.2"/>

  <!-- Connection lines between dots -->
  <line x1="200" y1="63" x2="272" y2="94" stroke="#34d399" stroke-width="1.5" opacity="0.3"/>
  <line x1="286" y1="106" x2="314" y2="194" stroke="#34d399" stroke-width="1.5" opacity="0.3"/>
  <line x1="314" y1="206" x2="286" y2="294" stroke="#34d399" stroke-width="1.5" opacity="0.3"/>
  <line x1="274" y1="300" x2="206" y2="340" stroke="#6ee7b7" stroke-width="1.5" opacity="0.2"/>
  <line x1="194" y1="340" x2="126" y2="300" stroke="#6ee7b7" stroke-width="1.5" opacity="0.2"/>

  <!-- "Living" pulse rings -->
  <circle cx="200" cy="200" r="165" fill="none" stroke="#10b981" stroke-width="1" opacity="0.15">
    <animate attributeName="r" from="165" to="185" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.15" to="0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="165" fill="none" stroke="#10b981" stroke-width="1" opacity="0.15">
    <animate attributeName="r" from="165" to="185" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.15" to="0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
